<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Indeks Pustaka</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            paper: '#F6F4EF',
            ink: '#181816',
            muted: '#6E6B63',
            vermilion: '#C2412D',
            rule: '#DCD7CC'
          },
          fontFamily: {
            serif: ['"Newsreader"', 'Georgia', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          }
        }
      }
    }
  </script>
  <style>
    /* Efek bayangan tulang punggung buku tipis */
    .book-cover {
      box-shadow: inset 3px 0 6px rgba(24, 24, 22, 0.14), 0 4px 12px rgba(24, 24, 22, 0.06);
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-paper text-ink min-h-screen font-sans antialiased selection:bg-vermilion selection:text-paper">

  <!-- Masthead / Header Editorial -->
  <header class="border-b border-ink/15 bg-paper/95 backdrop-blur sticky top-0 z-10">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 pt-5 pb-4">
      <div class="flex items-baseline justify-between border-b border-rule pb-3">
        <div>
          <span class="font-mono text-[10px] uppercase tracking-[0.2em] text-muted block">Arsip Pribadi // Vol. 01</span>
          <h1 class="font-serif text-2xl sm:text-3xl font-semibold tracking-tight text-ink mt-0.5">Indeks Pustaka</h1>
        </div>
        <span id="bookCount" class="font-mono text-xs text-muted">00 ENTRI</span>
      </div>

      <!-- Bar Pencarian Minimalis -->
      <div class="mt-3 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div class="relative flex-1">
          <input 
            id="searchInput" 
            type="text" 
            placeholder="Telusuri judul atau nama penulis..." 
            class="w-full bg-transparent border-b border-ink/25 py-1.5 pr-6 text-sm placeholder:text-muted/70 focus:outline-none focus:border-vermilion transition-colors"
          />
          <span class="font-mono text-xs text-muted absolute right-1 top-2">/</span>
        </div>

        <!-- Filter Kategori -->
        <div id="categoryFilters" class="flex gap-1.5 overflow-x-auto no-scrollbar py-0.5"></div>
      </div>
    </div>
  </header>

  <!-- Katalog Buku -->
  <main class="max-w-5xl mx-auto px-4 sm:px-6 py-8">
    <div id="bookGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-x-5 gap-y-9"></div>
    <div id="emptyState" class="hidden py-20 text-center border border-dashed border-rule">
      <p class="font-serif italic text-lg text-muted">Tidak ada entri yang cocok dengan pencarianmu.</p>
    </div>
  </main>

  <!-- Lembar Detail Buku -->
  <div id="bookModal" onclick="if(event.target === this) closeModal()" class="hidden fixed inset-0 z-20 bg-ink/50 backdrop-blur-[2px] flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-paper border-t sm:border border-ink w-full max-w-lg p-6 sm:p-8 space-y-6">
      <div class="flex justify-between items-start border-b border-rule pb-4">
        <div>
          <span id="modalIndex" class="font-mono text-[11px] text-vermilion uppercase tracking-widest"></span>
          <h2 id="modalTitle" class="font-serif text-2xl font-semibold leading-tight mt-1"></h2>
          <p id="modalAuthor" class="text-xs text-muted mt-1"></p>
        </div>
        <button onclick="closeModal()" class="font-mono text-xs uppercase tracking-wider text-muted hover:text-ink px-2 py-1 border border-rule">
          [Tutup]
        </button>
      </div>

      <div class="flex gap-5 items-start">
        <img id="modalCover" src="" alt="Sampul" class="w-24 sm:w-28 aspect-[2/3] object-cover book-cover border border-ink/10 shrink-0" />
        <p id="modalDesc" class="text-sm text-ink/85 leading-relaxed"></p>
      </div>

      <div class="pt-2">
        <a id="modalReadBtn" href="#" target="_blank" class="block w-full bg-ink hover:bg-vermilion text-paper font-mono text-xs uppercase tracking-[0.15em] py-3.5 text-center transition-colors">
          Buka Naskah →
        </a>
      </div>
    </div>
  </div>

  <script src="books.js"></script>
  <script>
    let selectedCategory = "Semua";
    const grid = document.getElementById("bookGrid");
    const searchInput = document.getElementById("searchInput");
    const categoryFilters = document.getElementById("categoryFilters");

    function renderCategories() {
      const categories = ["Semua", ...new Set(LIBRARY_BOOKS.map(b => b.category))];
      categoryFilters.innerHTML = categories.map(cat => `
        <button onclick="setCategory('${cat}')" class="font-mono text-[11px] uppercase tracking-wider px-2.5 py-1 border transition-colors whitespace-nowrap ${
          selectedCategory === cat 
            ? "border-ink bg-ink text-paper" 
            : "border-rule text-muted hover:border-ink/40 hover:text-ink"
        }">${cat}</button>
      `).join("");
    }

    function setCategory(cat) {
      selectedCategory = cat;
      renderCategories();
      renderBooks();
    }

    function renderBooks() {
      const query = searchInput.value.toLowerCase();
      const filtered = LIBRARY_BOOKS.filter(book => {
        const matchCat = selectedCategory === "Semua" || book.category === selectedCategory;
        const matchText = book.title.toLowerCase().includes(query) || book.author.toLowerCase().includes(query);
        return matchCat && matchText;
      });

      const countStr = String(filtered.length).padStart(2, '0');
      document.getElementById("bookCount").textContent = `${countStr} ENTRI`;
      document.getElementById("emptyState").classList.toggle("hidden", filtered.length > 0);

      grid.innerHTML = filtered.map((book, idx) => {
        const num = String(book.id).padStart(2, '0');
        return `
          <article onclick="openModal(${book.id})" class="group cursor-pointer flex flex-col">
            <div class="relative aspect-[2/3] w-full bg-rule/40 overflow-hidden book-cover border border-ink/10">
              <img src="${book.cover}" alt="${book.title}" class="w-full h-full object-cover group-hover:scale-[1.03] transition-transform duration-300" />
            </div>
            <div class="pt-3 flex-1 flex flex-col justify-between border-b border-rule pb-3">
              <div>
                <div class="flex items-center justify-between font-mono text-[10px] text-muted uppercase tracking-wider">
                  <span>No. ${num}</span>
                  <span class="text-vermilion">${book.category}</span>
                </div>
                <h3 class="font-serif text-base sm:text-lg font-semibold leading-snug mt-1 group-hover:text-vermilion transition-colors line-clamp-2">
                  ${book.title}
                </h3>
              </div>
              <p class="text-xs text-muted mt-1.5 line-clamp-1">${book.author}</p>
            </div>
          </article>
        `;
      }).join("");
    }

    function openModal(id) {
      const book = LIBRARY_BOOKS.find(b => b.id === id);
      if (!book) return;
      const num = String(book.id).padStart(2, '0');
      document.getElementById("modalIndex").textContent = `ENTRI NO. ${num} — ${book.category}`;
      document.getElementById("modalCover").src = book.cover;
      document.getElementById("modalTitle").textContent = book.title;
      document.getElementById("modalAuthor").textContent = `Ditulis oleh ${book.author}`;
      document.getElementById("modalDesc").textContent = book.description;
      document.getElementById("modalReadBtn").href = book.readUrl;
      document.getElementById("bookModal").classList.remove("hidden");
    }

    function closeModal() {
      document.getElementById("bookModal").classList.add("hidden");
    }

    searchInput.addEventListener("input", renderBooks);
    renderCategories();
    renderBooks();
  </script>
</body>
</html>
